# The Warrant access graph. `warrant.graph.load` upserts these rows into
# warrant.db; a later source of truth replaces the seed, not this shape.
#
# Every credential-shaped value belongs in .env, never here. Nothing in this
# file is a secret: ids, logins, group names, and resource names only.
#
# An agent id is the identity provider's client id, and a tool id is the MCP
# gateway's re-exported name (`<server prefix>.<upstream tool name>`). Both are
# load-bearing in W6: the gateway looks an actor up by the token's `act.sub`
# and a tool up by the name the agent called, so a mismatch is an unknown agent
# or an unknown tool rather than a silent pass.

humans:
  - id: h-alice
    login: alice
    groups: [engineering]
  - id: h-bob
    login: bob
    groups: [support]
  - id: h-carol
    login: carol
    # `support-leads` is the exemption the wrong-subject rule reads: a lead may
    # answer for a row the desk does not own. It is defined in the realm too, as
    # a group carol is a member of, so her token carries the claim the policy
    # checks.
    groups: [engineering, reviewers, support-leads]

agents:
  - id: triage-agent
    client_id: triage-agent
    owner_human_id: h-alice
    justification: read the issue queue to triage it
    justification_expires_at: null
    # Reads plus the writes a triage pass needs. `gitea.set_repo_visibility` is
    # granted because W7's policy set has to be able to refuse a tainted
    # visibility change with a rule rather than with the absence of a permit: a
    # tool no agent holds can only ever be refused by the default deny, and then
    # the quiet-control rule never appears in a decision. The grant is what makes
    # the taint rule the thing that refuses it, and the grant is narrow: one
    # tool, one agent.
    allowed_tools:
      - gitea.list_repos
      - gitea.list_issues
      - gitea.get_issue
      - gitea.get_file
      - gitea.search_code
      - gitea.create_issue_comment
      - gitea.create_branch
      - gitea.commit_file
      - gitea.set_repo_visibility
      - gitea.open_pull_request
  - id: support-agent
    client_id: support-agent
    owner_human_id: h-bob
    justification: answer the support mailbox
    justification_expires_at: "2027-01-01T00:00:00Z"
    allowed_tools:
      - mail.search
      - mail.send
      - db.search_customers
      - db.get_ticket
      - db.get_customer
      - db.run_readonly_sql
      - db.update_ticket
  # Empty justification on purpose: an agent an owner stood up without saying
  # why. `justification_valid` is false for it, which is the deny-safe case.
  - id: orphan-agent
    client_id: orphan-agent
    owner_human_id: h-carol
    justification: ""
    justification_expires_at: null
    allowed_tools: [db.search_customers, db.get_ticket, gitea.search_code]
  # Carol's live agent. The support-leads exemption is only reachable through a
  # permit, so the person who carries the group needs an agent she owns with a
  # live justification and the tools the exemption is about. Without this row the
  # exemption is a rule that can never fire, because every db and mail call by
  # carol would be refused by the baseline before the wrong-subject rule saw it.
  - id: support-lead-agent
    client_id: support-lead-agent
    owner_human_id: h-carol
    justification: answer escalated billing and mailbox questions for the desk
    justification_expires_at: null
    allowed_tools:
      - db.search_customers
      - db.get_ticket
      - db.get_customer
      - db.run_readonly_sql
      - db.update_ticket
      - db.rotate_api_key
      - mail.search
      - mail.send

tools:
  - id: gitea.list_repos
    server: gitea
    name: list_repos
    action_kind: read
    resource_kind: repo
  - id: gitea.list_issues
    server: gitea
    name: list_issues
    action_kind: read
    resource_kind: repo
  - id: gitea.get_issue
    server: gitea
    name: get_issue
    action_kind: read
    resource_kind: repo
  - id: gitea.get_file
    server: gitea
    name: get_file
    action_kind: read
    resource_kind: repo
  - id: gitea.search_code
    server: gitea
    name: search_code
    action_kind: read
    resource_kind: repo
  - id: gitea.create_issue_comment
    server: gitea
    name: create_issue_comment
    action_kind: write
    resource_kind: repo
  - id: gitea.create_branch
    server: gitea
    name: create_branch
    action_kind: write
    resource_kind: repo
  - id: gitea.commit_file
    server: gitea
    name: commit_file
    action_kind: write
    resource_kind: repo
  - id: gitea.open_pull_request
    server: gitea
    name: open_pull_request
    action_kind: write
    resource_kind: repo
  - id: gitea.set_repo_visibility
    server: gitea
    name: set_repo_visibility
    action_kind: write
    resource_kind: repo
  # The postgres MCP server's tools (W8). `db.run_readonly_sql` resolves to a
  # table through the FROM in its statement; the ticket and customer tools name a
  # row, and W12 seeds the resource rows whose owners the subject rule reads.
  # `db.query` and `db.execute` were the placeholders before the server existed;
  # they are gone, because a row for a tool no server offers is not authority.
  - id: db.search_customers
    server: db
    name: search_customers
    action_kind: read
    resource_kind: db_customer
  - id: db.get_ticket
    server: db
    name: get_ticket
    action_kind: read
    resource_kind: db_ticket
  - id: db.get_customer
    server: db
    name: get_customer
    action_kind: read
    resource_kind: db_customer
  - id: db.run_readonly_sql
    server: db
    name: run_readonly_sql
    action_kind: read
    resource_kind: db_table
  - id: db.update_ticket
    server: db
    name: update_ticket
    action_kind: write
    resource_kind: db_ticket
  - id: db.rotate_api_key
    server: db
    name: rotate_api_key
    action_kind: write
    resource_kind: db_customer
  - id: mail.search
    server: mail
    name: search
    action_kind: read
    resource_kind: mailbox
  - id: mail.send
    server: mail
    name: send
    action_kind: send
    resource_kind: mailbox

resources:
  - id: repo-acme-api
    kind: repo
    name: acme/api
    owner_human_id: h-alice
    sensitivity: internal
  - id: repo-acme-web
    kind: repo
    name: acme/web
    owner_human_id: h-carol
    sensitivity: public
  - id: repo-acme-widgets
    kind: repo
    name: acme/widgets
    owner_human_id: h-alice
    sensitivity: internal
  - id: table-orders
    kind: db_table
    name: public.orders
    owner_human_id: h-alice
    sensitivity: confidential
  # Bob's confidential table. Without a confidential row owned by the person
  # whose agent holds a database read, the confidential arm of the quiet-control
  # rule has nothing to refuse: a read of alice's table by bob's agent is refused
  # by the wrong-subject rule first, which is a different scenario.
  - id: table-support-billing
    kind: db_table
    name: support.billing
    owner_human_id: h-bob
    sensitivity: confidential
  - id: mailbox-support
    kind: mailbox
    name: support@acme.example
    owner_human_id: h-bob
    sensitivity: internal
