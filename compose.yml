# Warrant's local stack.
#
# W1 ships Keycloak, the identity provider every later service authenticates
# against. W3 adds Gitea, the forge the MCP server is a resource server in
# front of. W8 adds Postgres, the support database the second resource server
# reads and writes. W9 adds Mailpit, the mailbox the third resource server sends
# to and reads, so every message it sends can be inspected afterwards.
#
# `docker compose` reads `.env` from this directory for every value below, so
# credentials live in `.env` and never in this file. `.env.example` lists the
# names. A variable that is missing stops `make up` and says which one.

# Every worktree shares one stack. The project name is fixed here rather than
# taken from the directory the command runs in, so `make up` from a worktree
# starts, finds, and stops the same stack as the main checkout.
name: warrant

services:
  keycloak:
    # Patch-pinned. A bump changes the auth surface, so it is its own change,
    # with the realm import from W2 re-checked against it.
    image: quay.io/keycloak/keycloak:26.7.3
    # start-dev keeps state in the container's own store and serves plain
    # HTTP, which is what a local stack wants. Nothing here faces a network.
    # `--import-realm` reads infra/keycloak/warrant-realm.json on a store
    # that does not have the realm yet, so `make reset` reproduces it and a
    # later `make up` leaves it alone.
    command: ["start-dev", "--import-realm", "--features=parameterized-scopes"]
    ports:
      - "8080:8080"
    environment:
      # The username is not a secret, so it lives here. The passwords are not,
      # and `:?` refuses to start without them.
      # These are the 26.x names. KEYCLOAK_ADMIN and KEYCLOAK_ADMIN_PASSWORD,
      # which most published snippets still show, are ignored from 26.0 on.
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set: add it to .env}"
      # The realm import resolves `${WARRANT_USER_PASSWORD}` and
      # `${WARRANT_AGENT_CLIENT_SECRET}` in the JSON below from the
      # container's environment, so the committed realm file holds a
      # placeholder and the value stays in `.env`.
      WARRANT_USER_PASSWORD: "${WARRANT_USER_PASSWORD:?WARRANT_USER_PASSWORD is not set: add it to .env}"
      WARRANT_AGENT_CLIENT_SECRET: "${WARRANT_AGENT_CLIENT_SECRET:?WARRANT_AGENT_CLIENT_SECRET is not set: add it to .env}"
    volumes:
      # start-dev still writes its store under /opt/keycloak/data, so the
      # realm survives `make down`. `make reset` removes the volume and the
      # store with it.
      - keycloak-data:/opt/keycloak/data
      # The realm JSON is the system of record. This is the directory
      # `--import-realm` reads. Read-only: Keycloak only ever reads it.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image carries no curl, so the check is bash's own TCP redirect.
      # It turns healthy once the HTTP listener accepts connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    # No restart policy. This is a local stack, so `docker compose stop` should
    # leave it stopped; `unless-stopped` brings it back on the next Docker
    # start, which reads as a service nobody asked to run.

  gitea:
    # Patch-pinned to the 1.24 line the ticket names. The bare `1.24` tag is a
    # moving alias, and a Gitea bump moves the API the MCP server calls, so the
    # bump is its own change. This tag exists on the registry and pulls.
    image: gitea/gitea:1.24.7
    ports:
      - "3000:3000"   # web and API, which the MCP server and the tests call
      - "2222:22"     # ssh, for git clone from the host
    environment:
      # The container carries its own SQLite file under the volume. INSTALL_LOCK
      # skips the first-run web installer, which is what lets `make reset`
      # produce a working forge with no browser step. The schema is still
      # migrated on startup.
      GITEA__database__DB_TYPE: "sqlite3"
      GITEA__security__INSTALL_LOCK: "true"
      # Clone URLs and the SSH port the container advertises. ROOT_URL has to
      # name the published port, not the container's, or the API returns
      # clone URLs nothing on the host can reach.
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      GITEA__server__SSH_PORT: "2222"
      # Local stack: nobody self-registers. The bootstrap script creates the
      # admin, and W12 seeds the users the scenarios need.
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/data
    healthcheck:
      # The image ships curl. /api/healthz answers 200 once the app is serving,
      # which is what `make up --wait` and the bootstrap script wait for.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # --- W8 --------------------------------------------------------------------
  # The support database behind the postgres resource server. The schema is
  # mounted into the image's init directory, so a clean volume gets the tables
  # and no rows; W12 seeds the rows. `make reset` drops the volume and the next
  # `up` loads the schema again.
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      # The password is a credential and comes from `.env`; the user and the
      # database are not, so they live here the way Keycloak's admin username
      # does. The server's settings name the same user and database, and compose
      # overrides only the host.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set: add it to .env}"
      POSTGRES_USER: "warrant"
      POSTGRES_DB: "support"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Read-only: the postgres image runs this once, at initdb, and never
      # reads it again.
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warrant", "-d", "support"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- W6 --------------------------------------------------------------------
  # The gateway and the Gitea resource server it fronts. Both are built from
  # the one Dockerfile. The upstream port is `expose`d, not published: on the
  # compose network `gitea-mcp:9101` answers, and from the host nothing does.
  # Only the gateway publishes a port, so `localhost:9100` is the single way in.
  #
  # The issuer is the one deployment wart here. Keycloak mints `iss` from the
  # URL the token endpoint was reached at, `http://localhost:8080/...` for a
  # host-side login, and inside a container `localhost` is the container. A
  # deployment therefore needs an issuer hostname both the host and the compose
  # network resolve (or the host-side login to use that name too). That is
  # recorded in docs/decisions/004-gateway-hop.md; the host smoke run in the
  # ticket uses a host-run gateway and a host-run upstream.
  gitea-mcp:
    build:
      context: .
    image: warrant-local:latest
    command: ["python", "-m", "servers.gitea_mcp.server"]
    env_file: [.env]
    environment:
      GITEA_URL: "http://gitea:3000"
      GITEA_MCP_HOST: "0.0.0.0"
      GITEA_MCP_PORT: "9101"
      WARRANT_OIDC_ISSUER: "http://keycloak:8080/realms/warrant"
    expose:
      - "9101"
    depends_on:
      gitea:
        condition: service_healthy

  # The postgres resource server. Same image and the same network shape as the
  # gitea one: one built image, `expose` instead of `ports`, and the token
  # issuer overridden for the compose network. Only the host is overridden for
  # the database, so the user and database name come from `.env` and the code's
  # defaults, which are the two values the postgres service above was started
  # with.
  postgres-mcp:
    build:
      context: .
    image: warrant-local:latest
    command: ["python", "-m", "servers.postgres_mcp.server"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_MCP_HOST: "0.0.0.0"
      POSTGRES_MCP_PORT: "9102"
      WARRANT_OIDC_ISSUER: "http://keycloak:8080/realms/warrant"
    expose:
      - "9102"
    depends_on:
      postgres:
        condition: service_healthy

  # --- W9 --------------------------------------------------------------------
  # The mailbox. Every message the mail resource server sends lands here, so what
  # left the building can be read afterwards with no model in the loop. Mailpit
  # speaks plain SMTP and its HTTP API and web UI are on 8025.
  #
  # SMTP is `expose`d rather than published: only the compose network needs it,
  # and the mail server inside it is the only sender. The HTTP port is published
  # because the grader and the screenshots read the mailbox from the host.
  #
  # The image is not pinned to a patch the way Gitea and Keycloak are. Its two
  # surfaces are standard SMTP and a versioned HTTP API, there is no credential
  # behind it, and the mail server's client reads both rather than a version
  # string. A bump is a change to this line alone.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # http api and web ui
    expose:
      - "1025"        # smtp, for the compose network only
    healthcheck:
      # The image carries busybox wget and no curl. `/livez` answers 200 once the
      # HTTP listener is serving, which is what `--wait` and the mail server wait
      # for.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The mail resource server. Same image and the same network shape as the gitea
  # and postgres ones: one built image, `expose` instead of `ports`, and the
  # token issuer overridden for the compose network. The SMTP host and the
  # Mailpit API URL name the service above, which is the only change from the
  # code's host-side defaults.
  mail-mcp:
    build:
      context: .
    image: warrant-local:latest
    command: ["python", "-m", "servers.mail_mcp.server"]
    env_file: [.env]
    environment:
      SMTP_HOST: "mailpit"
      MAIL_URL: "http://mailpit:8025"
      MAIL_MCP_HOST: "0.0.0.0"
      MAIL_MCP_PORT: "9103"
      WARRANT_OIDC_ISSUER: "http://keycloak:8080/realms/warrant"
    expose:
      - "9103"
    depends_on:
      mailpit:
        condition: service_healthy

  warrant:
    build:
      context: .
    image: warrant-local:latest
    command: ["python", "-m", "warrant", "serve"]
    env_file: [.env]
    environment:
      WARRANT_GATEWAY_HOST: "0.0.0.0"
      WARRANT_GATEWAY_PORT: "9100"
      WARRANT_OIDC_ISSUER: "http://keycloak:8080/realms/warrant"
      GITEA_URL: "http://gitea:3000"
    ports:
      - "9100:9100"
    depends_on:
      keycloak:
        condition: service_healthy
      gitea-mcp:
        condition: service_started
      postgres-mcp:
        condition: service_started
      mail-mcp:
        condition: service_started

volumes:
  keycloak-data:
  gitea-data:
  postgres-data:

# --- later issues, commented until the issue that needs them ---------------
# Each block is a complete service definition. Uncommenting it and adding the
# volume it names is the whole change.
#
# --- W16 and W22, which add no compose service ------------------------------
# The adjudicator and its human queue (W16) and the second model family (W22)
# are processes and HTTP endpoints rather than long-lived services, so they add
# no block here. W16's escalation queue is a table the existing postgres
# serves, and W22 is a hosted API reached over the network. Their variables are
# stubbed in .env.example. If either turns out to need a service, its block
# goes above this line.
